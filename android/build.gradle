// The Android Gradle plugin lives here, not in the root build, so builds without an Android SDK
// (this module is then not included at all) never need to download it.
buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath 'com.android.tools.build:gradle:8.13.0'
  }
}

apply plugin: 'com.android.application'

android {
  namespace 'com.mygdx.game'
  compileSdk 36

  defaultConfig {
    applicationId 'com.mygdx.antevault'
    minSdk 21
    targetSdk 35
    versionCode 1
    versionName "$projectVersion"
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_11
    targetCompatibility JavaVersion.VERSION_11
  }

  sourceSets {
    main {
      manifest.srcFile 'src/main/AndroidManifest.xml'
      java.srcDirs = ['src/main/java']
      res.srcDirs = ['src/main/res']
      assets.srcDirs = [rootProject.file('assets')]
      jniLibs.srcDirs = ['libs']
    }
  }

  packaging {
    resources.excludes += ['META-INF/robovm/ios/robovm.xml', 'META-INF/DEPENDENCIES', 'META-INF/*.kotlin_module']
  }

  buildTypes {
    release {
      minifyEnabled false
    }
  }
}

// libGDX ships its Android natives as .so files inside these jars; unpack them into jniLibs.
configurations { natives }

dependencies {
  implementation project(':core')
  implementation "com.badlogicgames.gdx:gdx-backend-android:$gdxVersion"

  natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-armeabi-v7a"
  natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-arm64-v8a"
  natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-x86"
  natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-x86_64"
}

tasks.register('copyAndroidNatives') {
  doFirst {
    file("libs/armeabi-v7a/").mkdirs()
    file("libs/arm64-v8a/").mkdirs()
    file("libs/x86/").mkdirs()
    file("libs/x86_64/").mkdirs()

    configurations.natives.copy().files.each { jar ->
      def outputDir = null
      if (jar.name.endsWith("natives-armeabi-v7a.jar")) outputDir = file("libs/armeabi-v7a")
      if (jar.name.endsWith("natives-arm64-v8a.jar"))   outputDir = file("libs/arm64-v8a")
      if (jar.name.endsWith("natives-x86.jar"))         outputDir = file("libs/x86")
      if (jar.name.endsWith("natives-x86_64.jar"))      outputDir = file("libs/x86_64")
      if (outputDir != null) {
        copy {
          from zipTree(jar)
          into outputDir
          include "*.so"
        }
      }
    }
  }
}

tasks.matching { it.name.contains("merge") && it.name.contains("JniLibFolders") }.configureEach {
  it.dependsOn 'copyAndroidNatives'
}

